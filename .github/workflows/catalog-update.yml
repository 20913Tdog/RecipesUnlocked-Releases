name: Wowhead-only catalog updater (paused for rebuild)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require the new Wowhead-only import
        run: |
          echo 'Updater disabled: the previous catalog and collector do not satisfy the Wowhead-only source policy.'
          echo 'No catalog download, fallback, source ZIP execution or release publication is permitted.'
          exit 1
