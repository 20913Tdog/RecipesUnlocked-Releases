name: Cooking data updater

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cooking-release
  cancel-in-progress: false

jobs:
  cooking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Download the last published source package
        run: |
          mkdir bootstrap
          gh api "repos/$GH_REPO/releases/latest" > bootstrap/release.json
          gh release download --pattern '*-sources.zip' --pattern SHA256SUMS.txt --dir bootstrap
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('bootstrap')
          release=json.loads((root/'release.json').read_bytes())
          source=next(root.glob('*-sources.zip'))
          asset=next(a for a in release['assets'] if a['name']==source.name)
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          if asset.get('digest') and asset['digest']!='sha256:'+digest:
              raise SystemExit('GitHub source asset digest mismatch')
          expected={line.split('  ',1)[1]:line.split('  ',1)[0] for line in (root/'SHA256SUMS.txt').read_text().splitlines()}
          if expected.get(source.name)!=digest:
              raise SystemExit('Source checksum mismatch')
          dest=pathlib.Path('work').resolve()
          with zipfile.ZipFile(source) as z:
              for name in z.namelist():
                  if not (dest/name).resolve().is_relative_to(dest):
                      raise SystemExit('Unsafe source archive path')
              z.extractall(dest)
          PY
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/.cache
          key: cooking-upstreams-${{ runner.os }}-${{ github.run_id }}
          restore-keys: cooking-upstreams-${{ runner.os }}-
      - name: Install build and test tools
        run: python -m pip install -e 'work[test]'
      - name: Collect, compare, validate and bundle
        working-directory: work
        run: |
          recipes-unlocked collect
          recipes-unlocked update
          recipes-unlocked render
          python -m unittest discover -s tests -v
          recipes-unlocked bundle
          cat data/diff.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only changed packages
        working-directory: work
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,os
          build=json.loads(pathlib.Path('dist/build.json').read_bytes())
          previous=json.loads(pathlib.Path('../bootstrap/release.json').read_bytes())
          if previous['tag_name']==build['tag']:
              print('Cooking bundle is unchanged; no release created.')
              raise SystemExit(0)
          notes=pathlib.Path('dist/notes.md')
          diff=json.loads(pathlib.Path('data/diff.json').read_bytes())
          notes.write_text('Cooking catalog update. '+str(build['recipes'])+' recipes.\n\n'
              +str(len(diff['added']))+' added, '+str(len(diff['modified']))+' modified, '+str(len(diff['removed']))+' removed.\n\n'
              +'Sources and licences are included. Unconfirmed sources remain labelled.\n',encoding='utf-8')
          subprocess.run(['gh','release','create',build['tag'],'--title','Recipes Unlocked '+build['version'],
              '--notes-file',str(notes),'--draft','--target',os.environ['GITHUB_SHA'],
              'dist/'+build['addon'],'dist/'+build['sources'],'dist/SHA256SUMS.txt','dist/build.json'],check=True)
          subprocess.run(['gh','release','edit',build['tag'],'--draft=false','--latest'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cooking-build-and-diff
          path: |
            work/dist/*.zip
            work/dist/build.json
            work/data/diff.json
